<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10152c"><title>Six Player Ludo</title>
<style>
:root{color-scheme:dark;--bg:#0b1022;--card:#171e37;--line:#303c62;--gold:#ffd45c;--text:#eef2ff;--muted:#a9b5d7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#20294a,#0b1022 65%);color:var(--text);font:15px system-ui,Segoe UI,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}main{max-width:850px;margin:auto}header{display:flex;align-items:center;gap:10px;padding:12px 0}header h1{font-size:1.25rem;margin:0;flex:1}a,.btn{border:1px solid var(--line);border-radius:12px;background:#202a49;color:var(--text);padding:10px 13px;text-decoration:none;font-weight:700}#setup{background:#151d36;border:1px solid var(--line);border-radius:18px;padding:14px;margin:5px 0 14px}label{display:block;color:var(--muted);margin:10px 0 4px}select,input{width:100%;background:#0e1530;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.chip{border:1px solid var(--line);padding:7px 4px;border-radius:10px;text-align:center;font-size:12px}.chip.active{border-color:var(--gold);box-shadow:0 0 12px #ffd45c35}.chip small{display:block;color:var(--muted)}#boardwrap{position:relative;width:min(94vw,700px);margin:10px auto;aspect-ratio:1;background:#0d142b;border:1px solid #344264;border-radius:20px;overflow:hidden}canvas{display:block;width:100%;height:100%}#controls{display:flex;justify-content:center;align-items:center;gap:12px;margin:10px auto 16px;flex-wrap:wrap}#roll{font-size:1.15rem;min-width:115px;background:linear-gradient(135deg,#ffd45c,#f4a92d);color:#201700;border:0;border-radius:15px;padding:13px 22px;font-weight:900}#roll:disabled{opacity:.5}#status{text-align:center;min-height:24px;color:#d9e2ff;font-weight:700}.notice{text-align:center;color:var(--muted);font-size:12px;margin:5px}#moves{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.move{background:#273656;border:1px solid var(--gold);color:white;border-radius:10px;padding:9px 13px;font-weight:800}.hide{display:none!important}#winner{position:fixed;inset:0;background:#070b18dd;display:grid;place-items:center;padding:20px;z-index:5}#winner article{background:#202a49;border:1px solid var(--gold);border-radius:20px;padding:25px;max-width:420px;text-align:center;width:100%}@media(min-width:700px){#setup .row{grid-template-columns:1fr 1fr 1fr}}@media(max-width:400px){.row{grid-template-columns:1fr}header h1{font-size:1.05rem}#boardwrap{width:96vw}}
</style></head><body><main><header><a href="./index.html">← Main game</a><h1>🎲 Ludo · 6 Players</h1></header>
<section id="setup"><strong>Six-player local mode</strong><div class="row"><div><label>Human players (1–6)</label><select id="humans"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><div><label>Your display name</label><input id="yourname" maxlength="12" value="You"></div><div><label>AI level</label><select id="difficulty"><option value="0">Easy</option><option value="1" selected>Smart</option><option value="2">Competitive</option></select></div></div><button class="btn" id="start" style="width:100%;margin-top:12px;background:#eab83d;color:#201700;border:0">Start 6-player match</button></section>
<div class="chips" id="chips"></div><div id="status">Set match options and start.</div><div id="moves"></div><div id="boardwrap"><canvas id="board" aria-label="Six player Ludo board"></canvas></div>
<div id="controls"><button id="roll" disabled>🎲 Roll</button><button class="btn" id="restart">New match</button></div><p class="notice">Six-player mode is local (pass-and-play or bots). Online rooms remain in the classic mode.</p></main>
<div id="winner" class="hide"><article><h2 id="winTitle"></h2><p id="winText"></p><button class="btn" id="winAgain">Play again</button></article></div>
<script>
(()=>{
const C=['#ef4444','#3b82f6','#facc15','#f97316','#a855f7','#ec4899'],N=['Red','Blue','Yellow','Orange','Purple','Pink'],canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const R=6,track=[],homes=[],yard=[],dirs=[[0,-1],[-1,0],[-1,1],[0,1],[1,0],[1,-1]];
function buildRing(){let q=R,r=0;for(const d of dirs)for(let k=0;k<R;k++){track.push([q,r]);q+=d[0];r+=d[1]}}buildRing();
for(let p=0;p<6;p++){const start=track[p*6];homes[p]=[];for(let k=1;k<=5;k++)homes[p].push([start[0]*(R-k)/R,start[1]*(R-k)/R]);const out=[start[0]*1.25,start[1]*1.25];yard[p]=[[out[0]-.3,out[1]-.3],[out[0]+.3,out[1]-.3],[out[0]-.3,out[1]+.3],[out[0]+.3,out[1]+.3]]}
function xy([q,r]){return[q+r/2,-r*Math.sqrt(3)/2]}
let state=[],turn=0,dice=0,rolled=false,humans=1,finished=[],names=[],difficulty=1,active=false,selectable=[];
function resize(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);return[rect.width,rect.height]}
function draw(){const[w,h]=resize(),scale=Math.min(w,h)/16.5,cx=w/2,cy=h/2;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0d142b';ctx.fillRect(0,0,w,h);
function point(a){const[x,y]=xy(a);return[cx+x*scale,cy+y*scale]}
function hex(x,y,s,fill,stroke='#344264'){ctx.beginPath();for(let k=0;k<6;k++){let a=Math.PI/3*k+Math.PI/6,px=x+s*Math.cos(a),py=y+s*Math.sin(a);k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
hex(cx,cy,scale*6.9,'#151e39','#46557b');
track.forEach((t,i)=>{const[x,y]=point(t),p=Math.floor(i/6);hex(x,y,scale*.43,i%6===0?C[p]+'35':'#293552',i%6===0?C[p]:'#4a5875');if(i%6===0){ctx.beginPath();ctx.arc(x,y,scale*.16,0,Math.PI*2);ctx.fillStyle=C[p];ctx.fill()}});
for(let p=0;p<6;p++)homes[p].forEach((c,k)=>{const[x,y]=point(c);hex(x,y,scale*.43,C[p]+'55',C[p]);if(k===4){ctx.beginPath();ctx.arc(x,y,scale*.12,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}});
ctx.beginPath();ctx.arc(cx,cy,scale*.65,0,Math.PI*2);ctx.fillStyle='#f4c744';ctx.fill();ctx.strokeStyle='#fff4b0';ctx.stroke();ctx.fillStyle='#392800';ctx.font='bold '+Math.max(9,scale*.4)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('HOME',cx,cy);
for(let p=0;p<6;p++){const start=track[p*6],[x,y]=point([start[0]*1.25,start[1]*1.25]);hex(x,y,scale*1.3,C[p]+'22',C[p]);ctx.fillStyle=C[p];ctx.font='bold '+Math.max(10,scale*.45)+'px system-ui';ctx.fillText(N[p],x,y-scale*.8);yard[p].forEach(c=>{const[px,py]=point(c);ctx.beginPath();ctx.arc(px,py,scale*.22,0,Math.PI*2);ctx.fillStyle=C[p]+'30';ctx.fill();ctx.strokeStyle=C[p];ctx.lineWidth=2;ctx.stroke()})}
if(state.length)for(let p=0;p<6;p++)for(let i=0;i<4;i++){const prog=state[p][i],coord=prog<0?yard[p][i]:prog<36?track[(p*6+prog)%36]:prog<41?homes[p][prog-36]:[0,0];const[x,y]=point(coord);ctx.beginPath();ctx.arc(x,y,scale*.28,0,Math.PI*2);ctx.fillStyle=C[p];ctx.fill();ctx.strokeStyle=selectable.includes(p+':'+i)?'#fff':'#111827';ctx.lineWidth=selectable.includes(p+':'+i)?3:2;ctx.stroke();ctx.beginPath();ctx.arc(x-scale*.07,y-scale*.08,scale*.08,0,Math.PI*2);ctx.fillStyle='#ffffff88';ctx.fill();if(selectable.includes(p+':'+i)){ctx.beginPath();ctx.arc(x,y,scale*.4,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}}
}
function chips(){$('chips').innerHTML=N.map((n,p)=>'<div class="chip '+(p===turn&&active?'active':'')+'" style="border-color:'+C[p]+'"><b>'+n+'</b><small>'+names[p]+' · '+(p<humans?'Human':'CPU')+' · '+(state[p]?state[p].filter(v=>v===41).length:0)+'/4 home</small></div>').join('')}
function status(t){$('status').textContent=t}
function setupGame(){humans=+$('humans').value;difficulty=+$('difficulty').value;names=[($('yourname').value.trim()||'You').slice(0,12),...N.slice(1)];for(let p=1;p<humans;p++)names[p]='Player '+(p+1);state=Array.from({length:6},()=>[-1,-1,-1,-1]);turn=0;dice=0;rolled=false;finished=[];selectable=[];active=true;$('winner').classList.add('hide');$('setup').classList.add('hide');chips();status(names[turn]+': roll the dice');$('roll').disabled=false;draw()}
function legal(p,d){return state[p].map((r,i)=>({r,i})).filter(({r})=>r<0?d===6:r<41&&r+d<=41).map(v=>v.i)}
function isSafe(g){return g%6===0}
function gpos(p,progress){return(p*6+progress)%36}
function roll(){if(!active||rolled||turn>=humans)return;dice=1+Math.random()*6|0;rolled=true;$('roll').textContent='🎲 '+dice;$('roll').disabled=true;const m=legal(turn,dice);if(!m.length){status(names[turn]+' rolled '+dice+' · no move');setTimeout(()=>pass(false),850);return}selectable=m.map(i=>turn+':'+i);draw();if(m.length===1){status('Only one legal move');setTimeout(()=>move(m[0]),450)}else{status(names[turn]+' · choose a highlighted token');renderMoves(m)}}
function renderMoves(m){$('moves').innerHTML=m.map(i=>'<button class="move" data-i="'+i+'">Token '+(i+1)+'</button>').join('');$('moves').querySelectorAll('button').forEach(b=>b.onclick=()=>move(+b.dataset.i))}
function clearMoves(){selectable=[];$('moves').innerHTML=''}
function move(i){if(!active||!rolled)return;clearMoves();const old=state[turn][i],np=old<0?0:old+dice;state[turn][i]=np;let capture=false;if(np<36&&!isSafe(gpos(turn,np)))for(let q=0;q<6;q++)if(q!==turn)for(let j=0;j<4;j++){const r=state[q][j];if(r>=0&&r<36&&gpos(q,r)===gpos(turn,np)){state[q][j]=-1;capture=true}}
const home=state[turn].every(x=>x===41);if(home&&!finished.includes(turn)){finished.push(turn);status(names[turn]+' completed all tokens!')}draw();chips();if(home){finishMatch();return}const extra=dice===6||capture||np===41;if(!extra)pass(false);else{rolled=false;$('roll').disabled=false;$('roll').textContent='🎲 Roll again';status(names[turn]+(capture?' captured!':'')+' · extra roll')}if(turn>=humans&&active)setTimeout(aiTurn,500)}
function pass(extra){if(!extra){do{turn=(turn+1)%6}while(finished.includes(turn));}rolled=false;clearMoves();$('roll').disabled=turn>=humans;$('roll').textContent='🎲 Roll';chips();draw();status(names[turn]+' · '+(turn<humans?'roll the dice':'CPU thinking'));if(turn>=humans&&active)setTimeout(aiTurn,700)}
function aiTurn(){if(!active||turn<humans)return;dice=1+Math.random()*6|0;rolled=true;$('roll').textContent='CPU 🎲 '+dice;const m=legal(turn,dice);if(!m.length){setTimeout(()=>pass(false),700);return}let score=i=>{const old=state[turn][i],n=old<0?0:old+dice,s=n;let value=s;if(n>=36)value+=25;if(n===41)value+=70;if(n<36){const g=gpos(turn,n);for(let q=0;q<6;q++)if(q!==turn)for(const rr of state[q])if(rr>=0&&rr<36&&gpos(q,rr)===g&&!isSafe(g))value+=difficulty===2?55:30;if(isSafe(g))value+=8}return value};move(m.reduce((a,b)=>score(a)>score(b)?a:b))}
function finishMatch(){active=false;$('winner').classList.remove('hide');$('winTitle').textContent='🏆 '+names[finished[0]]+' wins!';$('winText').textContent='Finish order: '+finished.map((p,i)=>(i+1)+'. '+names[p]).join(' · ');$('roll').disabled=true}
function reset(){active=false;rolled=false;state=[];selectable=[];$('setup').classList.remove('hide');$('winner').classList.add('hide');$('roll').disabled=true;$('roll').textContent='🎲 Roll';status('Configure players, then start.');draw()}
canvas.addEventListener('click',e=>{if(!rolled||turn>=humans)return;const r=canvas.getBoundingClientRect(),scale=Math.min(r.width,r.height)/16.5,cx=r.width/2,cy=r.height/2;for(let i=0;i<4;i++){const prog=state[turn][i],coord=prog<0?yard[turn][i]:prog<36?track[(turn*6+prog)%36]:prog<41?homes[turn][prog-36]:[0,0];const[q,rr]=xy(coord),x=cx+q*scale,y=cy+rr*scale;if(Math.hypot(e.clientX-r.left-x,e.clientY-r.top-y)<scale*.48&&legal(turn,dice).includes(i)){move(i);break}}});
$('start').onclick=setupGame;$('roll').onclick=roll;$('restart').onclick=reset;$('winAgain').onclick=reset;window.addEventListener('resize',draw);draw();
})();
</script></body></html>
